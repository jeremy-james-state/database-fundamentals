<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relational databases — synced lesson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=56" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="top" id="top">
      <div class="brand" id="brand">
        <div class="brand-text" id="brandText">
          <p class="eyebrow">Database fundamentals</p>
          <h1 id="title">Relational databases</h1>
        </div>
        <button
          type="button"
          class="chrome-toggle brand-toggle"
          id="brandToggle"
          aria-expanded="true"
          aria-controls="brandText"
          aria-label="Hide title"
          title="Hide title"
        >
          <span class="chrome-toggle-icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="controls" id="controls">
        <div class="controls-body" id="controlsBody">
          <button
            type="button"
            class="speed-btn"
            id="speedBtn"
            aria-label="Playback speed 1×"
            title="Change playback speed"
          >
            1×
          </button>
          <button type="button" class="play-btn" id="playBtn" aria-label="Play">
            <span class="play-icon" aria-hidden="true"></span>
          </button>
        </div>
        <button
          type="button"
          class="chrome-toggle controls-toggle"
          id="controlsToggle"
          aria-expanded="true"
          aria-controls="controlsBody"
          aria-label="Hide playback controls"
          title="Hide playback controls"
        >
          <span class="chrome-toggle-icon" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <aside class="filmstrip-rail" id="filmstripRail">
        <button
          type="button"
          class="chrome-toggle filmstrip-toggle"
          id="filmstripToggle"
          aria-expanded="true"
          aria-controls="filmstrip"
          aria-label="Hide chapters"
          title="Hide chapters"
        >
          <span class="chrome-toggle-icon" aria-hidden="true"></span>
        </button>
        <nav class="filmstrip" id="filmstrip" aria-label="Chapters"></nav>
      </aside>

      <section class="pane visual" aria-label="Slide">
        <div class="slide-frame">
          <img id="slide" class="slide-img" alt="" aria-hidden="true" />
          <div id="visualStage" class="visual-stage" aria-live="polite"></div>
          <div class="slide-glow" aria-hidden="true"></div>
        </div>
      </section>

      <section class="pane lyrics-pane" aria-label="Synced narration">
        <button
          type="button"
          class="chrome-toggle lyrics-toggle"
          id="lyricsToggle"
          aria-expanded="true"
          aria-controls="lyricsViewport"
          aria-label="Hide lyrics"
          title="Hide lyrics"
        >
          <span class="chrome-toggle-icon" aria-hidden="true"></span>
        </button>
        <div class="lyrics-viewport" id="lyricsViewport">
          <div class="lyrics" id="lyrics"></div>
        </div>
      </section>
    </main>

    <footer class="transport" id="transport">
      <button
        type="button"
        class="chrome-toggle transport-toggle"
        id="transportToggle"
        aria-expanded="true"
        aria-controls="transportBody"
        aria-label="Hide scrubber"
        title="Hide scrubber"
      >
        <span class="chrome-toggle-icon" aria-hidden="true"></span>
      </button>
      <div class="transport-body" id="transportBody">
        <button type="button" class="ghost" id="backBtn" aria-label="Back 10 seconds">−10s</button>
        <div class="scrub">
          <div class="scrub-rail">
            <div class="scrub-fill" id="scrubFill"></div>
            <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Seek" />
          </div>
          <div class="times">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>
        <button type="button" class="ghost" id="fwdBtn" aria-label="Forward 10 seconds">+10s</button>
      </div>
    </footer>

    <audio id="audio" preload="auto" src="media/narration.mp3?v=56"></audio>
    <script src="player.js?v=56" type="module"></script>
  </body>
</html>
